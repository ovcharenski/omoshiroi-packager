[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omoshiroi-packager"  # ← с дефисом
version = "0.1.0"
description = "Version parser with multiple channels support"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ovcharenski", email = "stun.bread.frog@outlook.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://ns-staff.ovcharenski.ru/projects/omoshiroi-packager"
Repository = "https://github.com/ovcharenski/omoshiroi-packager"

[tool.setuptools.packages.find]
where = ["."]
include = ["omoshiroi_packager*"]